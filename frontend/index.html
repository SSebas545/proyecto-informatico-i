<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Patismos — Catálogo</title>
  <!-- Estilos del wireframe (etapa 2) + lo nuevo de la etapa 3 -->
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/etapa3.css">
</head>
<body>

  <div id="franja-sesion" class="franja-sesion oculto"></div>

  <header class="barra">
    <div class="barra-interior">
      <a class="marca" href="index.html">
        Los <em>Patismos</em>
        <small>Librería</small>
      </a>

      <form class="buscador" id="form-buscar" role="search">
        <label class="etiqueta" for="buscador">Buscar</label>
        <input id="buscador" type="search" placeholder="título, autor o tema…"
               aria-label="Buscar libros" autocomplete="off">
        <button class="boton-mini" type="submit">Buscar</button>
      </form>

      <div class="barra-derecha">
        <a class="enlace-barra" id="enlace-sesion" href="#">Ingresar</a>
        <button class="boton-carrito" id="boton-carrito" type="button">
          Mi carrito <span class="contador" id="contador-carrito">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="lienzo">

    <section>
      <div class="encabezado-seccion">
        <div>
          <span class="volanta">Colección</span>
          <h1 class="titulo-seccion">Catálogo de libros</h1>
          <p id="bajada-catalogo">Cargando el catálogo…</p>
        </div>
        <span class="etiqueta" id="cantidad-titulos">—</span>
      </div>

      <div id="mensaje-catalogo" class="mensaje" role="status" aria-live="polite"></div>

      <div class="grilla-libros" id="grilla"></div>
    </section>

    <aside class="lateral">

      <section class="bloque-lateral">
        <h3>Mi carrito</h3>
        <p class="carrito-vacio" id="resumen-carrito">Todavía no agregaste títulos.</p>
        <button class="boton-solido" id="ver-carrito" type="button">Ver carrito</button>
      </section>

      <section class="bloque-lateral">
        <h3>Categorías</h3>
        <div class="lista-categorias" id="lista-categorias">
          <div class="categoria activa" data-categoria="">
            <span class="casilla">✓</span><span>Todas</span>
          </div>
        </div>
      </section>

      <section class="bloque-lateral">
        <h3>Disponibilidad</h3>
        <label class="filtro">
          <input type="radio" name="stock" value="" checked>
          <span class="circulo"></span><span>Todos</span>
        </label>
        <label class="filtro">
          <input type="radio" name="stock" value="en">
          <span class="circulo"></span><span>En stock</span>
        </label>
        <label class="filtro">
          <input type="radio" name="stock" value="sin">
          <span class="circulo"></span><span>Sin stock</span>
        </label>
      </section>

    </aside>

  </main>

  <footer class="pie">
    <span>Los Patismos · Librería</span>
    <span>Etapa 3 — página funcional con MySQL</span>
  </footer>

  <!-- Acceso: login y registro en el mismo diálogo -->
  <dialog class="hoja" id="dialogo-sesion">
    <div class="hoja-cabeza">
      <h2 id="titulo-sesion">Iniciar sesión</h2>
      <button class="cerrar-hoja" type="button" data-cerrar aria-label="Cerrar">×</button>
    </div>

    <div class="hoja-cuerpo">
      <div id="mensaje-sesion" class="mensaje error" role="alert"></div>

      <form id="form-login" class="form-rejilla">
        <div class="campo ancho-total">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="username"
                 placeholder="admin@libreria.com">
        </div>
        <div class="campo ancho-total">
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" required autocomplete="current-password"
                 placeholder="••••••••">
        </div>
        <div class="acciones-acceso ancho-total">
          <button class="boton-solido" type="submit">Entrar</button>
          <button class="boton-linea" type="button" id="ir-registro">Crear una cuenta</button>
        </div>
      </form>

      <form id="form-registro" class="form-rejilla oculto">
        <div class="campo ancho-total">
          <label for="reg-nombre">Nombre</label>
          <input id="reg-nombre" type="text" required autocomplete="name">
        </div>
        <div class="campo ancho-total">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" required autocomplete="email">
        </div>
        <div class="campo ancho-total">
          <label for="reg-password">Contraseña (mínimo 6)</label>
          <input id="reg-password" type="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="acciones-acceso ancho-total">
          <button class="boton-solido" type="submit">Registrarme</button>
          <button class="boton-linea" type="button" id="ir-login">Ya tengo cuenta</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Detalle de un libro -->
  <dialog class="hoja" id="dialogo-detalle">
    <div class="hoja-cabeza">
      <h2 id="detalle-titulo">Detalle</h2>
      <button class="cerrar-hoja" type="button" data-cerrar aria-label="Cerrar">×</button>
    </div>
    <div class="hoja-cuerpo" id="detalle-cuerpo"></div>
    <div class="hoja-pie">
      <button class="boton-linea" type="button" data-cerrar>Cerrar</button>
      <button class="boton-solido" id="detalle-agregar" type="button">Agregar al carrito</button>
    </div>
  </dialog>

  <!-- Carrito -->
  <dialog class="hoja" id="dialogo-carrito">
    <div class="hoja-cabeza">
      <h2>Mi carrito</h2>
      <button class="cerrar-hoja" type="button" data-cerrar aria-label="Cerrar">×</button>
    </div>
    <div class="hoja-cuerpo">
      <div id="mensaje-carrito" class="mensaje" role="status" aria-live="polite"></div>
      <ul class="carrito-lista" id="lista-carrito"></ul>
      <div class="carrito-total">
        <span>Total</span>
        <span id="total-carrito">$0</span>
      </div>
    </div>
    <div class="hoja-pie">
      <button class="boton-linea" type="button" data-cerrar>Seguir mirando</button>
      <button class="boton-solido" id="comprar" type="button">Confirmar compra</button>
    </div>
  </dialog>

  <script type="module" src="js/tienda.js"></script>
</body>
</html>
